# nginx reverse proxy — TLS termination and security headers for CryptoTrace AI.
#
# Use this instead of deploy/Caddyfile when you already run nginx, when a cloud
# load balancer or CDN terminates TLS in front, or when certificates are issued
# by something other than Caddy (cert-manager, certbot, an internal CA).
#
# This file expects certificates at the paths below. Obtain them first, e.g.:
#
#   certbot certonly --webroot -w /var/www/html -d cryptotrace.example.com
#
# Then start the stack with the same Caddyfile-less setup:
#
#   docker compose up -d app db
#   sudo cp deploy/nginx.conf /etc/nginx/conf.d/cryptotrace.conf
#   sudo cp deploy/cryptotrace-selfsigned.crt /etc/nginx/certs/   # staging only
#   sudo nginx -t && sudo systemctl reload nginx

upstream cryptotrace_app {
    # The `app` service on the Compose network. Keep this internal — the app
    # speaks plain HTTP and must never be published directly.
    server app:8080;
    keepalive 32;
}

# Everything on :80 is redirected to HTTPS. ACME HTTP-01 challenges are the one
# exception, and they are handled by certbot's own server or an nginx location
# rather than here.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Uncomment to let certbot's webroot challenges through during renewal:
    # location /.well-known/acme-challenge/ { root /var/www/html; }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/cryptotrace.crt;
    ssl_certificate_key /etc/nginx/certs/cryptotrace.key;

    # TLS 1.2 is the floor. TLS 1.3 is on by default in modern nginx.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling needs a resolver; if you run without one, delete this block.
    # ssl_stapling on;
    # ssl_stapling_verify on;
    # resolver 1.1.1.1 8.8.8.8 valid=300s;
    # resolver_timeout 5s;

    # Must match the CSP in deploy/Caddyfile.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'; frame-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Response bodies stay on the app host, so a buffer is only needed for
    # streamed PDFs. Keep it modest and let nginx stream rather than spool.
    client_max_body_size 8m;

    # The tracer's server-side budget is up to 120s (chain.ts: max 120000ms),
    # so this must exceed it or long traces die mid-request.
    proxy_connect_timeout 10s;
    proxy_send_timeout 150s;
    proxy_read_timeout 150s;

    location / {
        proxy_pass http://cryptotrace_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # The API sets X-Request-Id and exposes it via CORS. Forwarding it
        # keeps log correlation working across both hops.
        proxy_set_header X-Request-Id      $http_x_request_id;
    }

    # Hashed, immutable build assets can be cached hard. index.html must not
    # be, or a deploy would never reach the browser.
    location /assets/ {
        proxy_pass http://cryptotrace_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    location = /index.html {
        proxy_pass http://cryptotrace_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store" always;
    }
}
